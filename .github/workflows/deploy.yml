# Veröffentlicht den statischen Export auf GitHub Pages (Branch gh-pages).
# Der Upload-Weg dieses Repos unterstützt nur Text, deshalb kommen Inhalte base64-kodiert:
#   deploy/part.*          kompletter Build (ersetzt gh-pages vollständig)
#   patch-upload/part.*    nur geänderte Build-Dateien, ggf. in Teilen (werden über gh-pages gelegt)
#   _upload/source.tar.b64 Quelltext-Stand (wird nach main entpackt)
# Nach erfolgreichem Lauf werden die Upload-Reste aus main entfernt.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  GIT_AUTHOR: -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Mehrteilige Uploads kommen in mehreren Pushes: erst loslegen, wenn alle Teile da sind
      # (`patch-upload/parts` enthält die erwartete Anzahl).
      - name: Vollständigkeit prüfen
        id: check
        run: |
          ready=true
          if [ -f patch-upload/parts ] && [ "$(ls patch-upload/part.[0-9]* | wc -l)" != "$(cat patch-upload/parts)" ]; then ready=false; fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Kompletten Build veröffentlichen
        if: steps.check.outputs.ready == 'true' && hashFiles('deploy/part.*') != ''
        run: |
          cat $(ls deploy/part.* | sort -V) | base64 -d > /tmp/site.tgz
          mkdir -p /tmp/site && tar xzf /tmp/site.tgz -C /tmp/site && touch /tmp/site/.nojekyll
          cd /tmp/site && git init -q -b gh-pages && git add -A
          git $GIT_AUTHOR commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Build-Patch einspielen
        if: steps.check.outputs.ready == 'true' && hashFiles('patch-upload/part.*') != ''
        run: |
          git worktree add /tmp/pages origin/gh-pages
          cat $(ls patch-upload/part.[0-9]* | sort -V) | base64 -d | tar xzf - -C /tmp/pages
          cd /tmp/pages && git add -A
          git $GIT_AUTHOR commit -qm "Patch ${GITHUB_SHA::7}" || exit 0
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages

      - name: Quelltext entpacken und Upload-Reste entfernen
        if: steps.check.outputs.ready == 'true'
        run: |
          changed=0
          if [ -f _upload/source.tar.b64 ]; then base64 -d _upload/source.tar.b64 | tar -xf -; git rm -rq _upload; changed=1; fi
          for d in deploy patch-upload; do if [ -d "$d" ]; then git rm -rq "$d"; changed=1; fi; done
          if [ "$changed" = 1 ]; then
            git add -A
            git $GIT_AUTHOR commit -m "Upload entpackt [skip ci]"
            git push origin HEAD:main
          fi
